<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة طلبات المساجد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; width: 100%; }
    .pub-page {
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 24px 16px; direction: rtl;
      width: 100%; box-sizing: border-box;
    }
    .pub-card {
      background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 560px; padding: 28px 26px; margin: 0 auto;
      box-sizing: border-box; overflow: hidden;
    }
    .pub-logo { text-align: center; margin-bottom: 6px; }
    .pub-logo .icon { font-size: 46px; }
    .pub-logo h1 { font-size: 21px; margin-top: 6px; }
    .pub-logo p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .pub-intro {
      background: var(--primary-light); color: var(--primary-dark);
      border-radius: 10px; padding: 10px 14px; font-size: 12.5px;
      text-align: center; margin: 16px 0 20px;
    }
    .kind-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
    .kind-btn {
      border: 2px solid var(--border); background: var(--surface); border-radius: 14px;
      padding: 18px 12px; text-align: center; transition: all .15s; font-family: inherit;
    }
    .kind-btn .k-icon { font-size: 30px; display: block; margin-bottom: 6px; }
    .kind-btn .k-label { font-size: 15px; font-weight: 700; color: var(--text); display: block; }
    .kind-btn .k-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; display: block; }
    .kind-btn:hover { border-color: var(--primary); }
    .kind-btn.active { border-color: var(--primary); background: var(--primary-light); }
    .pub-form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; min-width: 0; }
    /* منع الحقول والقوائم الطويلة من تمديد النموذج خارج البطاقة (إصلاح overflow الجوال) */
    .pub-form .form-row, .pub-form .form-grid, .pub-form .form-grid > * { min-width: 0; }
    .pub-form .input, .pub-form .select, .pub-form .textarea { min-width: 0; max-width: 100%; }
    .pub-form .select option { max-width: 100%; }
    .pub-section-title { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin-top: 6px; }
    .pub-success { text-align: center; padding: 20px 8px; }
    .pub-success .s-icon { font-size: 58px; }
    .pub-success h2 { font-size: 20px; margin: 10px 0 6px; }
    .pub-success .s-ref {
      display: inline-block; background: var(--bg); border: 1px dashed var(--border);
      border-radius: 8px; padding: 6px 14px; font-weight: 700; margin: 10px 0; letter-spacing: .5px;
    }
    .pub-footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 18px; }
    /* فخّ الروبوتات — مخفي عن المستخدمين */
    .hp-field { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div class="pub-page">
    <div class="pub-card" id="app">
      <div class="loading"><div class="spinner"></div><span>جارٍ التحميل…</span></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/submit.js"></script>
</body>
</html>
